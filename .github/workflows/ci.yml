name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  foundry-tests:
    name: Foundry build + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show versions
        run: |
          forge --version
          cast --version

      - name: Build
        working-directory: contracts
        run: forge build

      - name: Unit tests
        working-directory: contracts
        run: forge test -vv

      - name: Invariants (fast set)
        working-directory: contracts
        run: |
          forge test -vv --match-test invariant
          forge test -vv --match-contract QKeyRotationInvariantSmart
